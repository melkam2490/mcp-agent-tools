[project]
name = "mcp-agent-tools"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "melkam2490", email = "melkam2490@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.162.4",
    "httpx>=0.28.1",
    "mcp[cli]<2",
    "openai>=3.49.0",
    "pydantic>=2.14.3",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "python-dotenv>=1.2.4",
    "streamlit>=1.67.0",
    "uvicorn>=0.54.0",
]

[project.scripts]
mcp-agent-tools = "mcp_agent_tools:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
